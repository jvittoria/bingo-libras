<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo LIBRAS - EDM0400</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        @media print {
            .no-print { display: none !important; }
            .card-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 15px !important; }
            .bingo-card { border: 2px dashed #4f46e5 !important; background: #ffffff !important; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Cabeçalho -->
    <header class="no-print bg-indigo-700 text-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold">Bingo Interativo em LIBRAS</h1>
                <p class="text-xs text-indigo-200">EDM0400 - Educação Especial & Inclusão</p>
            </div>
            <div class="flex gap-2 bg-indigo-900/50 p-1 rounded-xl">
                <button id="tab-draw-btn" onclick="switchTab('draw')" class="px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-700 shadow">
                    Sorteador
                </button>
                <button id="tab-cards-btn" onclick="switchTab('cards')" class="px-4 py-2 rounded-lg text-sm font-bold text-white hover:bg-white/10">
                    Gerador de Cartelas
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6">

        <!-- ABA 1: SORTEADOR -->
        <section id="tab-draw" class="space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <label for="max-number" class="text-sm font-bold text-slate-700">Intervalo:</label>
                    <select id="max-number" onchange="resetGame()" class="bg-slate-100 border border-slate-300 rounded-lg p-2 text-sm font-bold">
                        <option value="50">1 a 50 (Bingo Rápido)</option>
                        <option value="75" selected>1 a 75 (Padrão)</option>
                    </select>
                </div>
                <button onclick="resetGame()" class="px-3 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-bold border border-rose-200">
                    Reiniciar Sorteio
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <!-- Destaque Principal -->
                <div class="md:col-span-5 flex flex-col">
                    <div class="bg-white p-6 rounded-2xl shadow-md border border-indigo-100 flex-1 flex flex-col items-center justify-center text-center">
                        <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold uppercase mb-4">Último Sorteado</span>
                        
                        <div class="w-full min-h-[200px] bg-indigo-50/50 rounded-xl p-4 my-2 flex items-center justify-center gap-2 border border-indigo-100" id="libras-display">
                            <span class="text-slate-400 text-sm font-medium">Clique no botão abaixo para sortear</span>
                        </div>

                        <button id="draw-btn" onclick="drawNextNumber()" class="w-full py-4 mt-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-extrabold text-lg shadow-md active:scale-95 transition">
                            Sortear Próximo Número
                        </button>
                    </div>
                </div>

                <!-- Painel Geral -->
                <div class="md:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-800 text-base">Painel Geral de Chamada</h3>
                        <span id="drawn-count" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full">
                            0 / 75 Sorteados
                        </span>
                    </div>
                    <div id="numbers-board" class="grid grid-cols-5 sm:grid-cols-8 gap-2 max-h-[400px] overflow-y-auto p-1"></div>
                </div>
            </div>
        </section>

        <!-- ABA 2: GERADOR DE CARTELAS -->
        <section id="tab-cards" class="hidden space-y-6">
            <div class="no-print bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <label class="text-sm font-bold text-slate-700">Quantidade:</label>
                    <select id="card-quantity" class="bg-slate-100 border border-slate-300 rounded-lg p-2 text-sm font-bold">
                        <option value="2">2 Cartelas</option>
                        <option value="4" selected>4 Cartelas</option>
                        <option value="6">6 Cartelas</option>
                        <option value="10">10 Cartelas</option>
                    </select>
                    <button onclick="generateCards()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-sm shadow">
                        Gerar Novas
                    </button>
                </div>
                <button onclick="window.print()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm shadow">
                    Imprimir / Salvar PDF
                </button>
            </div>

            <div id="cards-container" class="card-grid grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

    </main>

    <footer class="no-print bg-slate-100 border-t border-slate-200 mt-auto py-3 text-center text-xs text-slate-500">
        EDM0400 - Didática e Educação Especial • LIBRAS
    </footer>

    <script>
        function getLibrasRepresentation(num, isLarge = false) {
            const digits = num.toString().split('');
            const imgSize = isLarge ? 'w-20 h-24' : 'w-8 h-10';
            return digits.map(d => `
                <div class="bg-white p-0.5 rounded-lg border border-slate-200 flex items-center justify-center">
                    <img src="libras/${d}.jpg" alt="${d}" class="${imgSize} object-contain rounded" onError="this.onerror=null;this.src='https://via.placeholder.com/80?text=${d}';" />
                </div>
            `).join('');
        }

        let maxNum = 75;
        let drawnNumbers = [];

        function initBoard() {
            const board = document.getElementById('numbers-board');
            board.innerHTML = '';
            for (let i = 1; i <= maxNum; i++) {
                const btn = document.createElement('div');
                btn.id = `num-cell-${i}`;
                btn.className = `p-1 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center opacity-30`;
                btn.innerHTML = `<div class="flex gap-0.5 scale-75">${getLibrasRepresentation(i)}</div>`;
                board.appendChild(btn);
            }
            updateDrawnCount();
        }

        function drawNextNumber() {
            if (drawnNumbers.length >= maxNum) {
                alert('Todos os números já foram sorteados!');
                return;
            }

            let num;
            do {
                num = Math.floor(Math.random() * maxNum) + 1;
            } while (drawnNumbers.includes(num));

            drawnNumbers.push(num);

            document.getElementById('libras-display').innerHTML = getLibrasRepresentation(num, true);

            const cell = document.getElementById(`num-cell-${num}`);
            if (cell) {
                cell.className = "p-1 rounded-lg bg-indigo-50 border-2 border-indigo-500 flex items-center justify-center shadow scale-105 opacity-100";
            }

            updateDrawnCount();
        }

        function updateDrawnCount() {
            document.getElementById('drawn-count').innerText = `${drawnNumbers.length} / ${maxNum} Sorteados`;
        }

        function resetGame() {
            maxNum = parseInt(document.getElementById('max-number').value);
            drawnNumbers = [];
            document.getElementById('libras-display').innerHTML = '<span class="text-slate-400 text-sm font-medium">Clique no botão abaixo para sortear</span>';
            initBoard();
        }

        function generateCards() {
            const qty = parseInt(document.getElementById('card-quantity').value);
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            for (let c = 1; c <= qty; c++) {
                const numbers = [];
                while (numbers.length < 24) {
                    const r = Math.floor(Math.random() * 75) + 1;
                    if (!numbers.includes(r)) numbers.push(r);
                }

                const card = document.createElement('div');
                card.className = "bingo-card bg-white p-4 rounded-xl border-2 border-indigo-200 shadow-sm flex flex-col justify-between";

                let gridHTML = `<div class="grid grid-cols-5 gap-1 text-center my-2">`;
                ['B', 'I', 'N', 'G', 'O'].forEach(letter => {
                    gridHTML += `<div class="bg-indigo-600 text-white font-black py-1 rounded text-sm">${letter}</div>`;
                });

                let numIdx = 0;
                for (let i = 0; i < 25; i++) {
                    if (i === 12) {
                        gridHTML += `<div class="bg-indigo-50 border border-indigo-200 rounded flex items-center justify-center h-14 font-bold text-xs text-indigo-700">LIVRE</div>`;
                    } else {
                        const val = numbers[numIdx++];
                        gridHTML += `
                            <div onclick="this.classList.toggle('bg-emerald-200')" class="border border-slate-200 rounded p-0.5 flex items-center justify-center h-14 bg-slate-50 cursor-pointer hover:bg-slate-100">
                                <div class="flex gap-0.5 scale-90">${getLibrasRepresentation(val)}</div>
                            </div>
                        `;
                    }
                }
                gridHTML += `</div>`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center border-b border-slate-200 pb-1 mb-1">
                            <span class="text-xs font-bold text-indigo-700">EDM0400 • Cartela #${c}</span>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">BINGO LIBRAS</span>
                        </div>
                        ${gridHTML}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function switchTab(tab) {
            const drawTab = document.getElementById('tab-draw');
            const cardsTab = document.getElementById('tab-cards');
            const drawBtn = document.getElementById('tab-draw-btn');
            const cardsBtn = document.getElementById('tab-cards-btn');

            if (tab === 'draw') {
                drawTab.classList.remove('hidden');
                cardsTab.classList.add('hidden');
                drawBtn.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-700 shadow";
                cardsBtn.className = "px-4 py-2 rounded-lg text-sm font-bold text-white hover:bg-white/10";
            } else {
                drawTab.classList.add('hidden');
                cardsTab.classList.remove('hidden');
                cardsBtn.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-700 shadow";
                drawBtn.className = "px-4 py-2 rounded-lg text-sm font-bold text-white hover:bg-white/10";
                if (document.getElementById('cards-container').children.length === 0) generateCards();
            }
        }

        window.onload = function() { initBoard(); };
    </script>
</body>
</html>
